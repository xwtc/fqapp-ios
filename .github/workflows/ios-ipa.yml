name: iOS IPA (unsigned, LiveContainer / sideload)

# 在 GitHub macOS runner 上从零产出「未签名 IPA」。
# LiveContainer 安装时用自己的证书重签，所以这里刻意不做 codesign。
#
# 设计依据（全部来自实际读源码，不是模板）：
#
# 1) Rust 核心用静态库链接。
#    iOS 不允许 dlopen 应用自带的 dylib；且 LiveContainer 重签时，
#    单一二进制比嵌套 framework 的失败率低得多。
#
# 2) 静态链接必须 -force_load。
#    Dart 只用 FFI 按符号名查找，链接器看不到任何静态引用，
#    默认会把整个 .a 当死代码剥掉，运行时表现为 Failed to lookup symbol。
#    这里不用 podspec，直接往 Flutter 的 Release.xcconfig 追加 OTHER_LDFLAGS，
#    路径用 $(SRCROOT) 求值，避免 CocoaPods 沙箱与路径转义问题。
#
# 3) FRB 2.13 的 iOS 默认加载器只认 {stem}.framework（动态框架），
#    见 frb_dart/lib/src/loader/_io.dart。静态链接场景必须改用
#    ExternalLibrary.process()。补丁打在 backend_transport.dart
#    的 ensureRuntime()，该文件是手写的，不是 @generated。
#
# 版本对齐：与仓库 .github/workflows/android-apk.yml 保持一致。

on:
  workflow_dispatch:
    inputs:
      skip_codegen:
        description: '跳过 FRB codegen（绑定已提交，可省约 8 分钟）'
        type: boolean
        default: true
      use_lockfile:
        description: '严格使用 pubspec.lock（注意：7.3.1 也含 iOS 26 API，无效）'
        type: boolean
        default: false
      patch_connectivity:
        description: '把 connectivity_plus 钉到 7.0.0（最后一个不含 iOS 26 API 的版本）'
        type: boolean
        default: false
  push:
    branches: [master, ios]
    # 刻意不把 .github/workflows/ios-ipa.yml 放进 paths：
    # 否则每次修改本工作流都会自触发一次构建，再被 concurrency 取消，
    # 白白消耗一轮 runner 时间。改 CI 请用 workflow_dispatch 手动验证。
    paths:
      - 'lib/**'
      - 'rust/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'ios/**'

permissions:
  contents: read

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.6'
  FRB_VERSION: '2.13.0'
  RUST_TOOLCHAIN: '1.99.1'
  RUST_TARGET: 'aarch64-apple-ios'
  IOS_DEPLOYMENT_TARGET: '15.0'
  # 相对仓库根目录的静态库路径
  RUST_LIB_REL: 'rust/target/aarch64-apple-ios/release/libfqapi_core.a'
  CARGO_TERM_COLOR: always

jobs:
  ipa:
    # macos-26 / macos-15 实测都会长时间排队（runner_id 一直为 null），
    # 免费额度下 macos-14 的池子大得多，实测能立刻分配。
    #
    # 代价：macos-14 是 Xcode 15.4（iOS 17 SDK），
    # connectivity_plus 7.1.0+ 用了 iOS 26 的 NWPath.isUltraConstrained，
    # 必然编译失败。因此这条路径必须配合 patch_connectivity=true
    # （把 connectivity_plus 钉到 7.0.0，最后一个不含该 API 的版本）。
    runs-on: macos-14
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Show toolchain
        run: |
          xcodebuild -version
          sw_vers
          xcode-select -p

      # ---------------------------------------------------------------
      # 自带一个不依赖 nm 的符号读取器。
      #
      # 前几轮用 `grep -a -c` 判定符号是否存在，得到 0。但 macOS 自带 BSD grep，
      # 在 94MB、几乎没有换行符的归档上不可靠，且无法区分「真的没有」和「读不了」。
      # 更关键的是：Xcode 15/16 的 nm 读不了 Rust 1.99.1（LLVM 23）的 DWARF。
      #
      # 这里改成自己解析：
      #   1) bytes.count 纯字节子串计数（语义完全确定）
      #   2) ar 归档的 __.SYMDEF 索引 —— 归档自己声明的导出表，
      #      链接器看到的就是它。这是最决定性的证据。
      #   3) 逐个成员的 Mach-O LC_SYMTAB 符号表
      # 三条互相印证。--require-frb 在没有 frb* 符号时以 2 退出。
      #
      # 解析器已在本地用合成 Mach-O/ar 固件验证过（test_machosym.py）。
      # ---------------------------------------------------------------
      - name: Write the Mach-O symbol reader
        run: |
          cat > /tmp/machosym.py <<'PY'
          """Read the symbols out of a Mach-O image or a classic ar archive.

          Why this exists: the runner's `nm` cannot read Rust 1.99.1 objects (LLVM 23
          DWARF vs Xcode's LLVM 17 reader), and `grep -a` on a 94 MB archive conflates
          "absent" with "unreadable". Both failure modes look like a clean zero.

          This parser only uses bytes.count and struct.unpack_from on the documented
          Mach-O / ar layouts, so a zero is a real zero.

          Exit codes:
              0  ran to completion (and, with --require-frb, found an frb* symbol)
              2  --require-frb was given and no frb* symbol exists
          """

          import struct
          import sys

          MAGIC64 = 0xfeedfacf
          MAGIC32 = 0xfeedface
          FAT_BE = (0xcafebabe, 0xcafebabf)
          LC_SYMTAB = 0x2
          AR_MAGIC = b'!<arch>\n'


          def macho_syms(buf, base=0):
              """Return externally visible, defined symbol names of one Mach-O image."""
              if len(buf) - base < 28:
                  return None
              magic = struct.unpack_from('<I', buf, base)[0]
              if magic == MAGIC64:
                  is64, hdr = True, 32
              elif magic == MAGIC32:
                  is64, hdr = False, 28
              else:
                  return None
              ncmds = struct.unpack_from('<I', buf, base + 16)[0]
              off = base + hdr
              out = []
              for _ in range(ncmds):
                  if off + 8 > len(buf):
                      break
                  cmd, cmdsize = struct.unpack_from('<II', buf, off)
                  if cmdsize < 8:
                      break
                  if cmd == LC_SYMTAB and off + 24 <= len(buf):
                      symoff, nsyms, stroff, _strsize = struct.unpack_from('<IIII', buf, off + 8)
                      entsz = 16 if is64 else 12
                      for i in range(nsyms):
                          p = base + symoff + i * entsz
                          if p + entsz > len(buf):
                              break
                          if is64:
                              strx, ntype, _nsect, _ndesc, _nval = struct.unpack_from('<IBBhQ', buf, p)
                          else:
                              strx, ntype, _nsect, _ndesc, _nval = struct.unpack_from('<IBBhI', buf, p)
                          # N_STAB debug entries (0xe0 mask) are not linkable symbols;
                          # N_EXT must be set; N_UNDF means the symbol is imported, not
                          # defined here. Only external defined symbols matter to us.
                          if ntype & 0xe0:
                              continue
                          if not ntype & 0x01:
                              continue
                          if (ntype & 0x0e) == 0x00:
                              continue
                          s = base + stroff + strx
                          if s >= len(buf):
                              continue
                          e = buf.find(b'\x00', s)
                          if e < 0:
                              continue
                          out.append(buf[s:e].decode('utf-8', 'replace'))
                  off += cmdsize
              return out


          def ar_members(data):
              """Return [(name, body_offset, size)] for a classic ar archive."""
              if not data.startswith(AR_MAGIC):
                  return None
              pos, out = 8, []
              while pos + 60 <= len(data):
                  hdr = data[pos:pos + 60]
                  if hdr[58:60] != b'`\n':
                      break
                  name = hdr[0:16].decode('ascii', 'replace').strip()
                  try:
                      size = int(hdr[48:58].decode('ascii').strip())
                  except ValueError:
                      break
                  body = pos + 60
                  if name.startswith('#1/'):
                      try:
                          nlen = int(name[3:])
                      except ValueError:
                          nlen = 0
                      name = data[body:body + nlen].decode('utf-8', 'replace').rstrip('\x00')
                      body += nlen
                      size -= nlen
                  out.append((name, body, size))
                  pos = body + size
                  if size % 2:
                      pos += 1
              return out


          def symdef_names(buf):
              """Parse a ranlib __.SYMDEF table: repeated (uint32 len, name bytes)."""
              names = []
              pos = 0
              while pos + 4 <= len(buf):
                  (n,) = struct.unpack_from('<I', buf, pos)
                  pos += 4
                  if n == 0 or n > 4096 or pos + n > len(buf):
                      break
                  names.append(buf[pos:pos + n].rstrip(b'\x00').decode('utf-8', 'replace'))
                  pos += n
              return names


          def report_archive(data, members, want):
              print('  format: ar archive, %d member(s)' % len(members))
              print('  first members: %s' % ', '.join(m[0] for m in members[:4]))

              # The ranlib index is the archive's own declaration of what it exports.
              # The linker resolves against exactly this, so it is the most decisive
              # artifact here and is independent of any nm/LLVM version mismatch.
              index = [m for m in members if 'SYMDEF' in m[0]]
              index_names = []
              if index:
                  name, body, size = index[0]
                  index_names = symdef_names(data[body:body + size])
                  frb_index = sorted(n for n in index_names if 'frb' in n)
                  print('  ranlib index "%s": %d entries, %d mention frb'
                        % (name, len(index_names), len(frb_index)))
                  for n in frb_index:
                      print('    %s' % n)
                  # A stripped index is empty; showing real entries separates
                  # "stripped" from "my parser is wrong".
                  print('  index sample: %s'
                        % (', '.join(index_names[:8]) if index_names else '(empty)'))
              else:
                  print('  ranlib index: ABSENT (archive has no __.SYMDEF)')

              hits, macho = {}, 0
              not_macho = []
              for name, body, size in members:
                  syms = macho_syms(data[body:body + size])
                  if syms is None:
                      if size >= 4:
                          not_macho.append((name, data[body:body + 4].hex()))
                      continue
                  macho += 1
                  for s in syms:
                      if 'frb' in s:
                          hits.setdefault(s, []).append(name)
              print('  Mach-O object members: %d of %d' % (macho, len(members)))
              if not_macho:
                  # Not Mach-O means LTO emitted LLVM bitcode, or the member is an index.
                  # 'bc c0 de' is bitcode; a Mach-O header starts 0xcffaedfe (LE cffaedfe
                  # reads as cffaedfe bytes) so anything else here is worth naming.
                  print('  non-Mach-O members: %d (first 5: %s)'
                        % (len(not_macho),
                           ', '.join('%s[%s]' % (n[:28], h) for n, h in not_macho[:5])))
              print('  distinct frb* symbols in object symbol tables: %d' % len(hits))
              for s in sorted(hits):
                  print('    %s  (%d member(s), e.g. %s)' % (s, len(hits[s]), hits[s][0]))
              for w in want:
                  print('  objects contain %-30s -> %d' % (w, len(hits.get(w, []))))

              # Dump the head of the crate's own object: the single fastest way to tell
              # a Mach-O object (fe ed fa cf) from LTO bitcode (de c0 17 0b) from a
              # stripped-to-nothing member.
              for name, body, size in members:
                  if 'fqapi_core' in name and size > 32:
                      print('  crate object "%s" head: %s'
                            % (name, data[body:body + 32].hex()))
                      break
              return bool(hits)


          def report_macho(data):
              syms = macho_syms(data)
              if syms is None:
                  print('  format: neither Mach-O nor ar')
                  return False
              frb = sorted(s for s in syms if 'frb' in s)
              print('  format: Mach-O image')
              print('  external defined symbols: %d' % len(syms))
              print('  external defined frb*: %d' % len(frb))
              for s in frb:
                  print('    %s' % s)
              return bool(frb)


          def report_fat(data, n):
              print('  format: fat binary, %d slice(s)' % n)
              found = False
              for i in range(n):
                  o = 8 + i * 20
                  if o + 20 > len(data):
                      break
                  cpu, _cpusub, off, size, _align = struct.unpack_from('>iiIII', data, o)
                  syms = macho_syms(data, off) or []
                  frb = sorted(s for s in syms if 'frb' in s)
                  print('  slice %d cputype=%d off=%d size=%d -> %d frb* symbol(s)'
                        % (i, cpu, off, size, len(frb)))
                  for s in frb:
                      print('    %s' % s)
                  found = found or bool(frb)
              return found


          def scan(path, want):
              try:
                  data = open(path, 'rb').read()
              except OSError as exc:
                  print('SKIP %s (%s)' % (path, exc))
                  return False
              print('')
              print('=== %s ===' % path)
              print('  bytes: %d' % len(data))
              for probe in want:
                  print('  raw substring %-32s -> %d' % (probe, data.count(probe.encode())))
              # A mangled Rust symbol proves the symbol table survived whatever ran.
              # If _ZN is present but no frb_ is, the frb_ functions are genuinely
              # absent rather than unreadable.
              print('  raw substring %-32s -> %d' % ('_ZN (mangled)', data.count(b'_ZN')))
              if len(data) >= 8 and struct.unpack_from('>I', data, 0)[0] in FAT_BE:
                  return report_fat(data, struct.unpack_from('>I', data, 4)[0])
              members = ar_members(data)
              if members is not None:
                  return report_archive(data, members, want)
              return report_macho(data)


          def main(argv):
              want = [a[len('--want='):] for a in argv if a.startswith('--want=')]
              require = '--require-frb' in argv
              paths = [a for a in argv if not a.startswith('--')]
              if not paths:
                  print('usage: machosym.py [--require-frb] [--want=SYM]... PATH...')
                  return 1
              found = False
              for p in paths:
                  if scan(p, want):
                      found = True
              print('')
              if require and not found:
                  print('VERDICT: FAIL - no frb* symbol in any scanned artifact')
                  return 2
              print('VERDICT: %s' % ('frb* symbols found' if found else 'none found'))
              return 0


          if __name__ == '__main__':
              sys.exit(main(sys.argv[1:]))

          PY
          python3 -c "import ast; ast.parse(open('/tmp/machosym.py').read()); print('machosym.py parses OK')"

      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          targets: aarch64-apple-ios

      - name: Cache the Cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: ios-${{ env.RUST_TARGET }}

      - name: Install flutter_rust_bridge_codegen
        if: ${{ inputs.skip_codegen == false }}
        run: cargo install flutter_rust_bridge_codegen --version "$FRB_VERSION" --locked

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # 仓库没有 ios/ 目录，只补平台目录，不动 lib/ 与 pubspec.yaml。
      # 注意：shell 代码行一律用 ASCII，中文只写在 YAML 注释里。
      # 之前用中文 echo + Windows 写入，GBK 字节破坏了 xcconfig 的换行，
      # 导致 OTHER_LDFLAGS 被并入注释、链接参数静默失效。
      - name: Generate the iOS project if missing
        run: |
          if [ ! -d ios ]; then
            echo "ios/ missing; generating Flutter iOS project"
            flutter create --platforms=ios --org com.fqapp --project-name fqapp .
          else
            echo "ios/ exists; skipping"
          fi
          ls -la ios

      - name: Generate the bridge bindings
        if: ${{ inputs.skip_codegen == false }}
        run: flutter_rust_bridge_codegen generate --config-file flutter_rust_bridge.yaml

      # ---------------------------------------------------------------
      # Rust 静态库
      # ---------------------------------------------------------------
      # 一次性完整诊断：不因任何单条命令失败而退出。
      # 之前用 set -e，ar/nm 一失败整个脚本就静默中断，导致我误把
      # "检查没跑" 当成 "符号数为 0"，连续误判了好几轮。
      - name: Compile the Rust core for iOS (arm64, static)
        run: |
          START=$(date +%s)

          # rust/Cargo.toml pins strip = true in [profile.release], and the repo
          # forbids editing that file (it would diverge from the Android build).
          # CARGO_PROFILE_RELEASE_STRIP is the documented override, but on a
          # cargo that predates the knob it is accepted and ignored, which is
          # exactly the silent failure we have been chasing. So set it AND pass
          # -Cstrip=none straight to rustc: RUSTFLAGS is appended after cargo's
          # own codegen flags, so the last value wins regardless of cargo's
          # version.
          export CARGO_PROFILE_RELEASE_STRIP=none
          export RUSTFLAGS="${RUSTFLAGS:-} -Cstrip=none -Cdebuginfo=0"
          echo "CARGO_PROFILE_RELEASE_STRIP=$CARGO_PROFILE_RELEASE_STRIP"
          echo "RUSTFLAGS=$RUSTFLAGS"

          # Prove the flag reached rustc rather than being dropped: ask cargo to
          # print the exact rustc invocation for this crate.
          #
          # pipefail + PIPESTATUS: `$?` after a pipeline is the last command's
          # status (tail), not cargo's. Without this the build verdict is tail's
          # and a failing compile would look like a success.
          set -o pipefail
          set +e
          cargo build --manifest-path rust/Cargo.toml --release \
            --target "$RUST_TARGET" -v 2>&1 | tee /tmp/cargo-verbose.log | tail -5
          CARGO_RC=${PIPESTATUS[0]}
          set -e
          echo "cargo exit=$CARGO_RC elapsed=$(( $(date +%s) - START ))s"
          [ "$CARGO_RC" -eq 0 ] || { echo "::error::cargo build failed"; exit 1; }

          echo "=== did -Cstrip=none reach rustc for fqapi_core? ==="
          grep -a 'fqapi_core' /tmp/cargo-verbose.log \
            | grep -a 'rustc' | head -2 || echo "(no fqapi_core rustc line found)"
          if grep -a 'fqapi_core' /tmp/cargo-verbose.log | grep -qa 'strip=none'; then
            echo "OK: -Cstrip=none is on the fqapi_core rustc command line"
          else
            echo "::error::strip=none did NOT reach rustc; symbols may be stripped"
          fi

          LIB="$RUST_LIB_REL"
          set +e
          test -s "$LIB" && echo "lib present" || { echo "::error::lib missing: $LIB"; exit 1; }
          ls -l "$LIB"
          echo "file type: $(file -b "$LIB")"
          echo "=== static lib size ==="
          du -h "$LIB"

          echo "=== archive structure ==="
          echo "ar -t member count: $(ar -t "$LIB" 2>/dev/null | wc -l)"
          echo "--- first 5 members ---"
          ar -t "$LIB" 2>/dev/null | head -5

          # 决定性检查：自己解析 ar + Mach-O 符号表。
          # 之前用 `grep -a -c` 判定，在 94MB、几乎没有换行的二进制上不可靠，
          # 而且它无法区分「真的没有」和「读不了」。machosym.py 用 bytes.count
          # 做纯字节子串计数，再解析 LC_SYMTAB / __.SYMDEF 拿真实导出符号名。
          #
          # set +e 包住：--require-frb 在缺符号时以 2 退出，set -e 会在
          # AUDIT_LIB=$? 之前就终止脚本，那就又变成"检查没跑"了。
          set +e
          echo ""
          echo "########## staticlib symbol audit ##########"
          python3 /tmp/machosym.py --require-frb \
            --want=frb_get_rust_content_hash \
            --want=frb_pde_ffi_dispatcher_primary \
            --want=store_dart_post_cobject \
            "$LIB"
          AUDIT_LIB=$?
          echo "staticlib audit exit=$AUDIT_LIB"

          echo ""
          echo "########## rlib symbol audit ##########"
          RLIB=rust/target/aarch64-apple-ios/release/libfqapi_core.rlib
          if [ -f "$RLIB" ]; then
            python3 /tmp/machosym.py "$RLIB"
          else
            echo "(no rlib built)"
          fi

          echo ""
          echo "########## cdylib symbol audit ##########"
          SO=rust/target/aarch64-apple-ios/release/libfqapi_core.dylib
          if [ -f "$SO" ]; then
            python3 /tmp/machosym.py "$SO"
          else
            echo "(no dylib built)"
          fi
          set -e

          # 静态库缺 frb_* 就没必要继续跑了：后面所有步骤都会失败。
          if [ "$AUDIT_LIB" -ne 0 ]; then
            echo "::error::the staticlib exports no frb_* symbol; the link would produce an empty core"
            exit 1
          fi

      # ---------------------------------------------------------------
      - name: Link the static library into the Runner target
        run: |
          set -euo pipefail
          LIB_ABS="$(cd rust && pwd)/target/aarch64-apple-ios/release/libfqapi_core.a"
          echo "LIB_ABS=$LIB_ABS"
          ls -lh "$LIB_ABS" || { echo "::error::static lib missing"; exit 1; }

          PBX=ios/Runner.xcodeproj/project.pbxproj
          echo "=== pbxproj: XCBuildConfiguration blocks ==="
          grep -nE 'isa = XCBuildConfiguration|PRODUCT_BUNDLE_IDENTIFIER|name = (Debug|Release|Profile);' "$PBX" | head -40

          python3 - "$LIB_ABS" "$PBX" <<'PY'
          import sys, pathlib

          lib, pbx_path = sys.argv[1], sys.argv[2]
          p = pathlib.Path(pbx_path)
          text = p.read_text()

          if 'force_load' in text:
              print('pbxproj already patched')
              sys.exit(0)

          # -force_load puts every archive member on the linker's table, but ld
          # then runs its dead_strip pass. Nothing in the ObjC shell references
          # frb_*, so the whole Rust core is unreachable and gets removed
          # again -- that is why the main binary stayed at 1.1 MB even though
          # -force_load was visibly present in OTHER_LDFLAGS.
          #
          # -Wl,-u,_<sym> creates a required undefined reference. dead_strip
          # treats such symbols as roots, so the symbol and everything it
          # reaches survive. If the archive really lacks the symbol the link
          # fails loudly instead of silently producing an empty core, which
          # also makes this the decisive experiment.
          #
          # Deliberately NOT setting DEAD_CODE_STRIPPING = NO: that would keep
          # all 94 MB of the archive and bloat the app for no benefit. Roots
          # plus normal dead_strip keep exactly the reachable subset.
          #
          # The list is every symbol the Dart side looks up; see
          # generalized_frb_rust_binding/_io.dart in flutter_rust_bridge 2.13.0.
          ANCHORS = (
              'frb_get_rust_content_hash',
              'frb_pde_ffi_dispatcher_primary',
              'frb_pde_ffi_dispatcher_sync',
              'frb_dart_fn_deliver_output',
              'frb_create_shutdown_callback',
              'frb_init_frb_dart_api_dl',
              'frb_free_wire_sync_rust2dart_dco',
              'frb_free_wire_sync_rust2dart_sse',
              'frb_dart_opaque_dart2rust_encode',
              'frb_dart_opaque_rust2dart_decode',
              'frb_dart_opaque_drop_thread_box_persistent_handle',
              'frb_rust_vec_u8_new',
              'frb_rust_vec_u8_resize',
              'frb_rust_vec_u8_free',
              'store_dart_post_cobject',
          )
          lines = [
              'buildSettings = {',
              '\t\t\t\tOTHER_LDFLAGS = (',
              '\t\t\t\t\t"$(inherited)",',
              '\t\t\t\t\t"-Wl,-force_load,%s",' % lib,
          ]
          for name in ANCHORS:
              lines.append('\t\t\t\t\t"-Wl,-u,_%s",' % name)
          lines.append('\t\t\t\t);')
          inject = '\n'.join(lines)

          # Split into XCBuildConfiguration blocks by locating the isa line and
          # walking to the matching closing brace.
          idx = 0
          out = []
          patched = 0
          marker = 'isa = XCBuildConfiguration;'
          while True:
              i = text.find(marker, idx)
              if i < 0:
                  out.append(text[idx:])
                  break
              # find enclosing '{' before i
              b = text.rfind('{', 0, i)
              # find matching close brace
              depth = 0
              j = b
              while j < len(text):
                  if text[j] == '{':
                      depth += 1
                  elif text[j] == '}':
                      depth -= 1
                      if depth == 0:
                          break
                  j += 1
              block = text[b:j+1]
              # Only the app target: must carry the bundle id and not be a test target
              if ('PRODUCT_BUNDLE_IDENTIFIER' in block
                      and 'RunnerTests' not in block
                      and 'buildSettings = {' in block):
                  block = block.replace('buildSettings = {', inject, 1)
                  patched += 1
              out.append(text[idx:b])
              out.append(block)
              idx = j + 1

          new_text = ''.join(out)
          p.write_text(new_text)
          print('patched %d configuration(s)' % patched)
          if 'force_load' not in new_text:
              print('::error::patch did not land in pbxproj')
              sys.exit(1)
          PY

          echo "=== after patch ==="
          grep -c 'force_load' "$PBX" || true
          grep -c 'Wl,-u,_frb_' "$PBX" || true
          grep -n -A22 'OTHER_LDFLAGS' "$PBX" | head -30

      # 构建前先确认 Xcode 真的读到了这个设置。
      # 这是决定性证据：如果 showBuildSettings 里没有 force_load，
      # 说明注入位置不对，不必浪费时间跑完整构建。
      - name: Verify Xcode sees the link flag
        run: |
          set -eo pipefail
          flutter build ios --config-only --release --no-codesign 2>&1 | tail -10 || true
          echo "=== OTHER_LDFLAGS as Xcode sees it ==="
          SETTINGS=$(xcodebuild -showBuildSettings \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release 2>/dev/null || true)
          echo "$SETTINGS" | grep -i 'OTHER_LDFLAGS' || echo "(NOT FOUND)"
          echo "=== which config file does Runner use ==="
          echo "$SETTINGS" | grep -iE 'baseConfigurationReference|CONFIGURATION_TEMP_DIR' | head -5 || true
          if echo "$SETTINGS" | grep -qi 'force_load'; then
            echo "OK: force_load is visible to Xcode"
          else
            echo "::error::force_load NOT visible to Xcode; link flag will not take effect"
            exit 1
          fi
          if echo "$SETTINGS" | grep -q -- '-u,_frb_get_rust_content_hash'; then
            echo "OK: the -u anchor is visible to Xcode"
          else
            echo "::error::the -u anchor is missing; dead_strip would remove the Rust core again"
            exit 1
          fi

      # 实测：pod install 之后 Xcode 实际看到的 OTHER_LDFLAGS 是什么。
      # 这一步是诊断，不通过也要继续，但结果决定后续怎么修。
      - name: Diagnose effective link settings
        run: |
          set -eo pipefail
          flutter build ios --config-only --release --no-codesign 2>&1 | tail -20 || true

          echo "=== xcodebuild -showBuildSettings | OTHER_LDFLAGS ==="
          xcodebuild -showBuildSettings \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release 2>/dev/null \
            | grep -i 'OTHER_LDFLAGS' || echo "(OTHER_LDFLAGS not found in showBuildSettings)"

          echo "=== showBuildSettings | LIBRARY_SEARCH_PATHS ==="
          xcodebuild -showBuildSettings \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release 2>/dev/null \
            | grep -i 'LIBRARY_SEARCH_PATHS' || echo "(none)"

      - name: Bump the iOS deployment target
        run: |
          sed -i '' \
            "s/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = ${IOS_DEPLOYMENT_TARGET};/g" \
            ios/Runner.xcodeproj/project.pbxproj
          grep -c "IPHONEOS_DEPLOYMENT_TARGET = ${IOS_DEPLOYMENT_TARGET}" \
            ios/Runner.xcodeproj/project.pbxproj || true

      # 听书需要后台音频。LiveContainer 下能否真正后台运行仍需实测。
      - name: Enable background audio
        run: |
          PLIST=ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" "$PLIST"

      # ---------------------------------------------------------------
      # 原生播放器（iOS）
      #
      # 听书、短剧、阅读页内嵌视频全都走 `fqapp/native_player` 通道；
      # Android 由 NativePlayerPlugin.kt（ExoPlayer + CENC 流式解密）实现，
      # iOS 侧此前完全没有对应实现，所以 Dart 调用 create 会直接抛
      # MissingPluginException —— 表现为"音频也无法播放"。
      #
      # 这里把 Swift 实现复制进 Runner target 并注册。CENC 解密不在 Swift
      # 里重做：Rust 核心已经能下载 + 原地解密 + 通过 /src/ 带 Range 提供
      # 明文（见 rust/src/endpoints/media_local.rs），Dart 侧拿到的是明文
      # URL，AVPlayer 直接能播。
      # ---------------------------------------------------------------
      - name: Install the native player
        run: |
          set -eo pipefail
          SRC=ios-porting/native-player
          ls -l "$SRC"
          cp "$SRC/NativePlayerPlugin.swift" ios/Runner/
          cp "$SRC/NativePlayerRegistrar.swift" ios/Runner/
          python3 "$SRC/inject_native_player.py"

          echo "=== verify the sources are in the target ==="
          grep -c 'NativePlayerPlugin.swift' ios/Runner.xcodeproj/project.pbxproj
          grep -c 'NativePlayerRegistrar' ios/Runner/AppDelegate.swift
          grep -c 'NSAllowsLocalNetworking' ios/Runner/Info.plist

      # iOS 主屏图标下显示的是 CFBundleDisplayName。flutter create 用
      # --project-name fqapp 生成后这里是 "Fqapp"，和 Android 的
      # android:label="fqapp" 对不上，装到桌面上一眼能看出是移植版。
      # 只改这一处：本地化 .strings 需要 Xcode 参与拷贝，留到确认能跑起来之后。
      - name: Set the display name
        run: |
          PLIST=ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName fqapp" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string fqapp" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$PLIST"

      # ---------------------------------------------------------------
      # FRB iOS 加载补丁
      # ---------------------------------------------------------------
      - name: Patch the FRB loader for iOS static linking
        run: |
          python3 - <<'PY'
          import pathlib, sys

          p = pathlib.Path('lib/services/backend_transport.dart')
          src = p.read_text()
          original = src

          # 1) dart:io 的 Platform
          if "import 'dart:io' show Platform;" not in src:
              src = src.replace(
                  "import 'dart:async';\nimport 'dart:typed_data';",
                  "import 'dart:async';\nimport 'dart:io' show Platform;\nimport 'dart:typed_data';",
                  1)

          # 2) ExternalLibrary
          if 'flutter_rust_bridge_for_generated_io.dart' not in src:
              src = src.replace(
                  "import 'package:http/http.dart' as http;",
                  "import 'package:flutter_rust_bridge/flutter_rust_bridge_for_generated_io.dart';\n"
                  "import 'package:http/http.dart' as http;",
                  1)

          # 3) ensureRuntime: inject externalLibrary per platform
          old = "  static Future<void> ensureRuntime() => _runtimeReady ??= RustLib.init();"
          new = (
              "  static Future<void> ensureRuntime() =>\n"
              "      _runtimeReady ??= RustLib.init(\n"
              "        externalLibrary: _externalLibraryForPlatform(),\n"
              "      );\n"
              "\n"
              "  /// On iOS the Rust core is statically linked into the Runner main\n"
              "  /// binary (see -force_load in ios-ipa.yml). There is no dylib to\n"
              "  /// open, so look the symbols up in the main binary itself.\n"
              "  /// Other platforms return null and keep the default FRB loader.\n"
              "  static ExternalLibrary? _externalLibraryForPlatform() {\n"
              "    if (Platform.isIOS) {\n"
              "      // fqapi_core is the only flutter_rust_bridge user in this process.\n"
              "      return ExternalLibrary.process(iKnowHowToUseIt: true);\n"
              "    }\n"
              "    return null;\n"
              "  }"
          )

          if old not in src:
              print("::error::ensureRuntime() original not found; upstream may have changed")
              sys.exit(1)
          src = src.replace(old, new, 1)

          if src == original:
              print("::error::patch produced no change")
              sys.exit(1)

          p.write_text(src)
          print("patch applied")
          PY

      - name: Verify the patch
        run: |
          grep -n "ExternalLibrary.process" lib/services/backend_transport.dart
          grep -n "import 'dart:io' show Platform;" lib/services/backend_transport.dart
          grep -n "_externalLibraryForPlatform" lib/services/backend_transport.dart

      # 降级 connectivity_plus 到 7.0.0。
      # 7.1.0 起 iOS 源码引入 NWPath.isUltraConstrained（iOS 26 SDK 才有），
      # 在 Xcode < 26 上必然编译失败。7.0.0 是最后一个干净版本。
      # 只影响 iOS 构建：Android 侧这个包的 API 在 7.x 之间没有破坏性变更，
      # 且本仓库只用到 onConnectivityChanged / checkConnectivity。
      - name: Pin connectivity_plus for older Xcode
        if: ${{ inputs.patch_connectivity == true }}
        run: |
          python3 - <<'PY'
          import pathlib, re
          p = pathlib.Path('pubspec.yaml')
          s = p.read_text()
          s2 = re.sub(r'^(\s*connectivity_plus:\s*)\^?[0-9][^\s#]*',
                      r'\g<1>7.0.0', s, count=1, flags=re.M)
          if s2 == s:
              print('::error::connectivity_plus not declared in pubspec.yaml')
              raise SystemExit(1)
          p.write_text(s2)
          print('connectivity_plus -> 7.0.0')
          PY
          grep -n 'connectivity_plus' pubspec.yaml

      - name: Resolve Dart dependencies
        run: |
          # Default: resolve by pubspec.yaml ranges (picks connectivity_plus 7.3.2).
          # use_lockfile: strictly follow pubspec.lock.
          if [ "${{ inputs.use_lockfile }}" = "true" ]; then
            flutter pub get --enforce-lockfile
          else
            flutter pub get
          fi
          echo "--- resolved connectivity_plus ---"
          grep -A3 '^  connectivity_plus:' pubspec.lock | head -8 || true

      - name: Build iOS (no codesign)
        run: |
          set -o pipefail
          flutter build ios --release --no-codesign 2>&1 | tee build.log
          ls -la build/ios/iphoneos/

      # 关键校验：不用装机就能知道静态链接成没成。
      # 这里用同一个 machosym.py 解析主二进制的 Mach-O 符号表，
      # 而不是 `grep -a`：后者在几十 MB 的二进制上不可靠，
      # 会把「读不到」和「不存在」混成同一个 0。
      - name: Verify the Rust symbols reached the main binary
        run: |
          set -eo pipefail
          BIN=build/ios/iphoneos/Runner.app/Runner
          echo "BIN=$BIN"
          ls -lh "$BIN" || { echo "::error::main binary not found: $BIN"; ls -R build/ios/iphoneos/ | head -40; exit 1; }

          echo "--- binary info ---"
          file "$BIN"

          # --require-frb: 没有 frb* 符号就以非零退出，这是本步骤的判据。
          # set +e 包住它，否则 set -e 会在 RC=$? 之前就终止脚本。
          set +e
          python3 /tmp/machosym.py --require-frb "$BIN"
          RC=$?
          set -e
          if [ "$RC" -ne 0 ]; then
            echo "::error::no frb* symbol in the main binary; the Rust core was linked but stripped"
            echo "--- effective OTHER_LDFLAGS ---"
            xcodebuild -showBuildSettings \
              -workspace ios/Runner.xcworkspace \
              -scheme Runner \
              -configuration Release 2>/dev/null \
              | grep -i 'OTHER_LDFLAGS' || true
            echo "--- DEAD_CODE_STRIPPING as Xcode sees it ---"
            xcodebuild -showBuildSettings \
              -workspace ios/Runner.xcworkspace \
              -scheme Runner \
              -configuration Release 2>/dev/null \
              | grep -i 'DEAD_CODE_STRIPPING' || true
            echo "--- staticlib, for comparison ---"
            python3 /tmp/machosym.py "$RUST_LIB_REL" || true
            exit 1
          fi

          echo "OK: Rust symbols are in the main binary"

          echo "--- dynamic deps (must NOT list libfqapi_core) ---"
          otool -L "$BIN" | head -20

      # 即使符号校验失败也打包：先拿到能装的 IPA 验证端到端链路，
      # 符号问题可以后续再修，不阻塞用户拿到产物。
      - name: Package the unsigned IPA
        if: always()
        run: |
          set -eo pipefail
          if [ ! -d build/ios/iphoneos/Runner.app ]; then
            echo "::warning::no Runner.app; skipping packaging"
            exit 0
          fi
          VERSION=$(grep -m1 '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*//' | tr '+' '-')
          mkdir -p build/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/
          cd build/ipa
          zip -qry "fqapp-${VERSION}-unsigned.ipa" Payload
          shasum -a 256 "fqapp-${VERSION}-unsigned.ipa" | tee SHA256SUMS
          du -h "fqapp-${VERSION}-unsigned.ipa"

      - name: Upload the IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fqapp-ios-unsigned-${{ github.run_number }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            build/ipa/*.ipa
            build/ipa/SHA256SUMS

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fqapp-ios-diagnostics-${{ github.run_number }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            build.log
            ios/Flutter/*.xcconfig
            ios/Podfile
